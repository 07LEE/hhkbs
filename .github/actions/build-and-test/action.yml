name: Build and test
description: Install the build dependencies, build HHKBS in Release mode and run its tests.

# CI and the release both build the same way; this is the one place that says how.
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          xvfb libgl1-mesa-dev libgl1-mesa-dri \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Configure
      shell: bash
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: bash
      run: cmake --build build --parallel

    - name: Test
      shell: bash
      run: ctest --test-dir build --output-on-failure
